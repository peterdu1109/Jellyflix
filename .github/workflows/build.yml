name: Build

# Vérifie chaque PR et chaque push sur main (lint, tests, APK). Pour les PR, l'APK de test est joint au run
# (artefact) et un commentaire unique, mis à jour à chaque commit, donne le lien.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Tests et APK de test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Jellyflix-test-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: jellyflix-test-${{ github.sha }}
          path: Jellyflix-test-*.apk
          retention-days: 30

      - name: Lien de l'APK dans la PR
        if: github.event_name == 'pull_request'
        continue-on-error: true   # pas de droit d'écriture sur les PR venant d'un fork
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- jellyflix-apk -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n📲 **APK de test** du commit \`${sha}\` : [télécharger (section « Artifacts »)](${url}).\n\n` +
              `Il s'installe à côté de la version publiée (identifiant \`.debug\`). Le lien exige d'être connecté à GitHub.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
