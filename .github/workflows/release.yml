name: Release

# Publie automatiquement une release GitHub avec son APK à CHAQUE push sur main.
#  - Première publication d'une versionName (app/build.gradle.kts)  -> tag vX.Y.Z
#  - Pushes suivants avec la même versionName                         -> tag vX.Y.Z-build.N
# Toutes les releases sont "latest" : le lien /releases/latest donne toujours l'APK le plus récent.
# versionCode augmente à chaque build pour que Android accepte la mise à jour par-dessus l'ancienne.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Une release à la fois, dans l'ordre des pushs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version et le tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            TAG="v$VERSION-build.${{ github.run_number }}"
            TITLE="Jellyflix $VERSION (build ${{ github.run_number }})"
          else
            TAG="v$VERSION"
            TITLE="Jellyflix $VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "code=$((100 + ${{ github.run_number }}))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (optionnelle)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=APK signé avec la clé de debug::Ajoutez les secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS et KEY_PASSWORD pour une signature stable (voir README)."
          fi

      - name: Tests et APK release
        env:
          APP_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Jellyflix-${{ steps.v.outputs.tag }}.apk"

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs "Jellyflix-${{ steps.v.outputs.tag }}.apk")
          echo "$OUT"
          SHA=$(echo "$OUT" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          {
            echo "### Signature de l'APK"
            echo "Empreinte SHA-256 du certificat : \`$SHA\`"
            if [ -z "${KEYSTORE_PATH:-}" ]; then
              echo
              echo "⚠️ Signé avec la clé de debug : chaque build a une signature différente, les mises à jour exigent de désinstaller l'ancienne version. Configurez les secrets de signature."
            else
              echo
              echo "✅ Clé de signature stable : les mises à jour s'installent par-dessus la version précédente."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.title }}
          make_latest: true
          generate_release_notes: true
          files: Jellyflix-${{ steps.v.outputs.tag }}.apk
          body: |
            ## 📲 Installation
            1. Téléchargez **Jellyflix-${{ steps.v.outputs.tag }}.apk** ci-dessous.
            2. **Téléphone** : ouvrez le fichier et autorisez l'installation depuis cette source.
            3. **Android TV** : installez l'app *Downloader* (ou envoyez l'APK via *Send Files to TV*), puis ouvrez l'APK.
            4. Lancez Jellyflix, saisissez l'adresse de votre serveur et connectez-vous.

            Nécessite Android 8.0+ et un serveur Jellyfin 10.10 ou plus récent.
            Commit : `${{ github.sha }}`
